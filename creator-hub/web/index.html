<title>Smore Creator Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Condensed:wght@600;700&family=Fredoka:wght@400;500;700&family=Nunito:wght@400;600;800&family=Poppins:wght@400;500;700&family=Montserrat:wght@400;500;700&family=Quicksand:wght@400;500;700&family=Baloo+2:wght@400;500;700&family=Lexend:wght@400;500;700&family=Rubik:wght@400;500;700&family=Outfit:wght@400;500;700&family=Comfortaa:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column, sticky top bar, stacked rounded cards, fixed 5-tab bottom nav */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f2f2f2; --line:#e3e3e3;
  --fg:#0f0f0f; --muted:#606060; --accent:#e3262d; --accent-ink:#ffffff;
  --good:#188038; --warn:#e8a600; --overlay:rgba(0,0,0,.42); --shimmer:rgba(255,255,255,.75);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --font:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Roboto Condensed","Roboto",system-ui,sans-serif;
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0f0f; --surface:#1b1b1b; --surface-2:#272727; --line:#2f2f2f;
  --fg:#f1f1f1; --muted:#a8a8a8; --accent:#ff4a45; --accent-ink:#ffffff;
  --good:#5cc97b; --warn:#ffc83d; --overlay:rgba(0,0,0,.6); --shimmer:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0f0f; --surface:#1b1b1b; --surface-2:#272727; --line:#2f2f2f;
  --fg:#f1f1f1; --muted:#a8a8a8; --accent:#ff4a45; --accent-ink:#ffffff;
  --good:#5cc97b; --warn:#ffc83d; --overlay:rgba(0,0,0,.6); --shimmer:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);overscroll-behavior-y:contain}
body{color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{display:block}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));zoom:var(--zoom,1)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:6px;padding-block:12px}
.top::after{content:"";position:absolute;left:-16px;right:-16px;bottom:0;height:1px;background:var(--line);opacity:0;transition:opacity .25s}
.top.scrolled::after{opacity:1}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0}
.brand b{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;overflow:hidden;flex:none}
.dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none;display:block}

/* headings */
h1,h2,h3{margin:0;text-wrap:balance}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.section-head h2{font-size:22px;font-weight:700;letter-spacing:-.2px}
.linkish{color:var(--muted);font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:2px}
.sample{display:inline-block;font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:3px 7px}

/* profile */
.profile{display:flex;align-items:center;gap:18px;margin-top:10px}
.profile .big{width:96px;height:96px;border-radius:50%;overflow:hidden;flex:none}
.profile h1{font-size:24px;font-weight:700}
.profile .count{font-size:34px;font-weight:900;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1.1}
.profile .sub{color:var(--muted);font-size:18px;font-weight:500}

/* stat tiles */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden;transition:transform .15s var(--ease)}
.tile:active{transform:scale(.98)}
.tile .lbl{color:var(--muted);font-size:15px;font-weight:500}
.tile .val{display:flex;align-items:center;gap:6px;font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.3px;min-height:36px}
.trend{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--surface);background:var(--muted)}
.trend.up{background:var(--good)}
.trend.ok{background:none;color:var(--good);border:2px solid var(--good)}
.trend.warn{background:none;color:var(--warn);border:2px solid var(--warn)}
.trend.ghost{background:none;color:var(--muted);border:1.5px dashed var(--muted);opacity:.7}
.tile{cursor:pointer}
.trend-btn{display:grid;place-items:center;border-radius:50%;width:30px;height:30px;margin:-5px;position:relative;overflow:hidden;flex:none}
.trend-btn.pop .trend{animation:pop .45s var(--ease)}
/* pull to refresh */
.ptr{position:fixed;left:50%;top:0;z-index:15;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:var(--surface);
  box-shadow:0 1px 3px rgba(0,0,0,.2),0 3px 10px rgba(0,0,0,.12);display:grid;place-items:center;color:var(--fg);opacity:0;pointer-events:none;transform:translateY(-50px)}
.ptr.spin svg{animation:spin .75s linear infinite}
.ptr.settle,#view.settle{transition:transform .32s var(--ease),opacity .25s}
@keyframes spin{to{transform:rotate(360deg)}}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.stack{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.vhead{display:flex;gap:14px;min-width:0;align-items:center;padding:14px 16px;cursor:pointer;position:relative;overflow:hidden}
.thumb{flex:none;border-radius:8px;overflow:hidden;background:#111;display:block;position:relative}
.thumb.short{width:56px;height:76px}
.thumb.wide{width:112px;height:63px}
.vtitle{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtitle:has(.editing){white-space:normal;overflow:visible}
.vmeta{color:var(--muted);font-size:14px;margin-top:2px}
.min0{min-width:0;flex:1}
.vstats{display:flex;align-items:center;gap:20px;padding:8px 8px 8px 16px;border-top:1px solid var(--line);font-weight:500;font-variant-numeric:tabular-nums;cursor:pointer;position:relative;overflow:hidden}
.vstats>span{display:inline-flex;align-items:center;gap:6px}
.vstats .chev{margin-left:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:transform .28s var(--ease);transform:rotate(180deg);position:relative;overflow:hidden}
.card.open .chev{transform:none}
.vwrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}
.card.open .vwrap{grid-template-rows:1fr}
.vclip{overflow:hidden;min-height:0}
.vbody{border-top:1px solid var(--line);padding:14px 16px;display:grid;gap:10px;opacity:0;transition:opacity .2s}
.card.open .vbody{opacity:1;transition-delay:.08s}
.flag{color:var(--warn)}
.cmt-mini{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.cmt-mini b{color:var(--fg);font-weight:500}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row-between h3{font-size:17px;font-weight:500}

/* tap-to-edit */
[data-inline]{border-radius:6px;cursor:text;transition:background-color .15s,box-shadow .15s;outline:none}
@media (hover:hover){[data-inline]:hover{background:var(--surface-2)}[data-pick]:hover{filter:brightness(1.12)}}
[data-pick]{cursor:pointer}
.editing{background:var(--surface-2);box-shadow:0 0 0 2px var(--accent);padding:0 3px;white-space:pre-wrap;overflow-wrap:anywhere}
.saved-flash{animation:flash .9s var(--ease)}
@keyframes flash{0%{background:color-mix(in srgb,var(--good) 28%,transparent)}100%{background:transparent}}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin:0 -2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;padding:8px 14px;border-radius:10px;background:var(--surface-2);font-weight:500;font-size:14px;transition:background-color .2s,color .2s;position:relative;overflow:hidden}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:999px;padding:0 14px;height:44px;margin:4px 0 12px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:15px}

/* list rows */
.list{display:grid;grid-template-columns:minmax(0,1fr)}
.lrow{display:flex;gap:12px;min-width:0;align-items:center;padding:12px 0;text-align:left;width:100%;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.lrow:last-child{border-bottom:0}
.lrow .stats{display:flex;gap:14px;color:var(--muted);font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
.lrow .stats>span{display:inline-flex;gap:4px;align-items:center}
.pill{font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--surface-2);color:var(--muted)}
.pill.live{background:var(--accent);color:var(--accent-ink)}

/* analytics */
.metric-tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);position:relative}
.mtab{padding:12px 8px 10px;text-align:left;min-width:0;position:relative;overflow:hidden}
.mtab .lbl{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtab .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;min-height:25px}
.ink{position:absolute;bottom:-1px;left:0;height:3px;width:25%;background:var(--fg);border-radius:3px 3px 0 0;transition:transform .32s var(--ease)}
.chart-wrap{padding:12px 8px 8px}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.12}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2;transform-box:fill-box;transform-origin:center}
.summary{padding:16px 16px 4px;font-size:18px;font-weight:500;text-wrap:balance}
.summary small{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
.bars{display:grid;gap:12px;padding:16px}
.bar .top-line{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.bar .top-line span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .track{height:8px;border-radius:99px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:var(--fg);transform-origin:left}
.bar .fill.accent{background:var(--accent)}
.rank{display:flex;gap:12px;align-items:center;padding:10px 16px;width:100%;text-align:left;position:relative;overflow:hidden}
.rank .n{width:18px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}

/* community */
.comment{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.comment:last-child{border-bottom:0}
.initial{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.comment .who{font-size:13px;color:var(--muted)}
.comment .who b{color:var(--fg);font-weight:500}
.comment .txt{margin-top:2px;overflow-wrap:anywhere}
.comment .on{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}
.actions{display:flex;gap:4px;margin-top:6px;margin-left:-10px}
.act{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:99px;font-size:13px;font-weight:500;color:var(--muted);position:relative;overflow:hidden}
.act.hearted{color:var(--accent)}
.act.pop svg{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.3)}100%{transform:scale(1)}}
.reply{margin-top:8px;padding:10px 12px;background:var(--surface-2);border-radius:12px;font-size:14px}
.reply b{font-weight:500}
.reply-form{display:flex;gap:8px;margin-top:8px}
.reply-form input{flex:1;min-width:0;border:0;border-bottom:2px solid var(--fg);background:none;padding:8px 2px;outline:none}
.btn{height:40px;padding:0 18px;border-radius:999px;font-weight:500;background:var(--fg);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;cursor:pointer;flex:none;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.red{background:var(--accent);color:var(--accent-ink)}

/* earn */
.hero-num{padding:18px 16px}
.hero-num .lbl{color:var(--muted);font-weight:500}
.hero-num .big{font-size:40px;font-weight:900;letter-spacing:-.8px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px;margin-top:4px;min-height:50px}
.progress{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--good);border-radius:99px;transform-origin:left}
.way{display:flex;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.way:first-child{border-top:0}
.way .ic{width:42px;height:42px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.way p{margin:2px 0 0;color:var(--muted);font-size:13px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);zoom:var(--zoom,1)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none;position:relative;overflow:hidden;transition:color .2s}
.tab .ico{height:30px;width:56px;border-radius:15px;display:grid;place-items:center;position:relative}
.tab .ico::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--surface-2);transform:scaleX(.4);opacity:0;transition:transform .3s var(--ease),opacity .2s}
.tab .ico svg{position:relative}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] .ico::before{transform:none;opacity:1}
.tab:not([aria-current="page"]) .fillable{fill:none}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:40;animation:fade .2s ease}
.scrim.closing{animation:fadeout .2s ease forwards;pointer-events:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-height:92%;overflow:auto;overscroll-behavior:contain;animation:up .3s var(--ease)}
.sheet.closing{animation:down .2s ease-in forwards;pointer-events:none}
.sheet-in{max-width:560px;margin:0 auto;zoom:var(--zoom-sheet,1)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-size:18px;font-weight:700;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:16px;width:100%;padding:14px 4px;text-align:left;font-size:16px;border-radius:12px;position:relative;overflow:hidden}
.opt .check{margin-left:auto;color:var(--accent)}
.notif{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.notif:last-child{border-bottom:0}
.notif .when{color:var(--muted);font-size:12px;margin-top:2px}
.field{display:grid;gap:6px;margin:12px 0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;outline:none;min-width:0;width:100%;transition:border-color .15s}
.field input:focus,.field select:focus{border-color:var(--fg)}

/* settings */
.set-sec{margin-top:22px;display:grid;gap:10px}
.set-sec>h4{margin:0;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:500}
.set-sec .hint{margin:-4px 0 0;color:var(--muted);font-size:13px}
.preview{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:12px;background:var(--bg);margin-top:12px}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ib{border-radius:14px;padding:6px;border:2px solid transparent;display:grid;place-items:center;background:var(--surface-2);position:relative;overflow:hidden;transition:border-color .2s}
.ib[aria-pressed="true"]{border-color:var(--fg)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35);transition:transform .15s}
.sw:active{transform:scale(.9)}
.sw[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:2px}
.sw-custom{position:relative;display:grid;place-items:center;background:conic-gradient(#e3262d,#f5b400,#1e9e5a,#2f6fe4,#7b4be0,#e3262d);overflow:hidden;cursor:pointer}
.sw-custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fo{border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;min-width:0;position:relative;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.fo[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.fo b{display:block;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fo small{color:var(--muted);font-size:12px;font-family:"Roboto",system-ui,sans-serif}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.three .field,.twocol .field{margin:0}
.vset{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;position:relative;overflow:hidden}
.vset:last-child{border-bottom:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:9px 6px;border-radius:9px;font-weight:500;font-size:14px;transition:background-color .2s,box-shadow .2s;position:relative;overflow:hidden}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.btn.danger{background:none;color:var(--accent);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger.armed{background:var(--accent);color:var(--accent-ink)}
.switch-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:4px 0}
.switch-row small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.switch{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background-color .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
[aria-checked="true"] .switch{background:var(--accent)}
[aria-checked="true"] .switch::after{transform:translateX(20px)}
.range-row{display:flex;align-items:center;gap:12px}
.range-row .a{font-size:13px;color:var(--muted);font-weight:500}
.range-row .b{font-size:20px;color:var(--muted);font-weight:500}
input[type="range"]{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.scale-val{font-variant-numeric:tabular-nums;font-weight:700;color:var(--fg)}

/* skeletons */
.sk{background:var(--surface-2);border-radius:8px;position:relative;overflow:hidden;display:block}
.sk.in{display:inline-block;vertical-align:middle}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--shimmer),transparent);animation:shimmer 1.15s ease-in-out infinite}
.sk-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.skel{animation:fade .2s ease}

/* ripple */
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.14;transform:scale(0);pointer-events:none;animation:ripple .55s ease-out forwards}

/* page + data entrance (only on page change or new data, never while editing) */
#view.enter>*{animation:rise .42s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
#view.enter .fill,#view.data-enter .fill,#view.enter .progress i,#view.data-enter .progress i{animation:grow .8s var(--ease) both;animation-delay:.12s}
#view.enter .chart .line,#view.data-enter .chart .line,.chart-wrap.draw .chart .line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s var(--ease) .1s forwards}
#view.enter .chart .area,#view.data-enter .chart .area,.chart-wrap.draw .chart .area{animation:fadeArea .9s ease .25s both}
#view.enter .chart .end,#view.data-enter .chart .end,.chart-wrap.draw .chart .end{animation:popIn .35s var(--ease) .85s both}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;
  background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;font-size:14px;max-width:calc(100% - 32px);animation:toastin .28s var(--ease)}
.toast.out{animation:toastout .2s ease forwards}

@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeArea{from{opacity:0}}
@keyframes popIn{from{transform:scale(0)}}
@keyframes shimmer{to{transform:translateX(100%)}}
@keyframes ripple{to{transform:scale(1);opacity:0}}
@keyframes toastin{from{transform:translate(-50%,16px);opacity:0}}
@keyframes toastout{to{transform:translate(-50%,10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const THUMBS=[["#1d2a1a","#0c0f0b","#9fd27a"],["#191919","#050505","#e8e8e8"],["#2a1d33","#0b0710","#ff5d73"],["#13283a","#06101a","#7fd0ff"],["#3a2614","#120b05","#ffb35c"],["#3a0f12","#120305","#ffd2d2"]];
const tcls=v=>v&&v.kind==="short"?"short":"wide";
function thumb(i,kind){
  const v=CFG.videos[i];
  if(v&&v.thumb)return `<img src="${v.thumb}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">`;
  const art=v?(v.art||0):i,[a,b,eye]=THUMBS[art%THUMBS.length];kind=kind||tcls(v);
  const w=kind==="short"?56:112,h=kind==="short"?76:63,cx=w/2,fy=h*.28,gid="g"+art+kind;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#${gid})"/><rect x="0" y="${h*.78}" width="${w}" height="${h*.22}" fill="${b}"/><path d="M${cx-7} ${h*.82} L${cx-5} ${fy+9} Q${cx} ${fy-3} ${cx+5} ${fy+9} L${cx+7} ${h*.82}z" fill="#000" opacity=".85"/><circle cx="${cx-2.2}" cy="${fy+6}" r="1.3" fill="${eye}"/><circle cx="${cx+2.2}" cy="${fy+6}" r="1.3" fill="${eye}"/></svg>`;
}

/* ---------- helpers ---------- */
function trend(d){return d>=0?`<span class="trend up" title="Up">${I.up}</span>`:`<span class="trend" title="Down">${I.down}</span>`}
function ago(s){const d=Math.max(0,Math.round((TODAY-parseD(s))/864e5));return d===0?"few hours":d===1?"1 day":d+" days"}
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
function series(n,total,seed){const r=rng(seed),raw=[];let s=0;for(let i=0;i<n;i++){let v=.6+r()*.8;if(r()>.9)v*=2.2;v*=1+.25*Math.sin(i/n*6.28);raw.push(v);s+=v}return raw.map(v=>v/s*total)}
function niceMax(m){if(m<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(m)));const f=m/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}

function chartSVG(){
  const p=P(),m=MET[S.metric],n=S.period===365?52:S.period;
  const data=series(n,p[m.key],S.period*7+S.metric.length*13);
  const Wd=320,H=170,L=40,R=10,T=12,B=24,iw=Wd-L-R,ih=H-T-B;
  const max=niceMax(Math.max(...data)*1.1);
  const x=i=>L+(n===1?0:i/(n-1)*iw),y=v=>T+ih-(v/max)*ih;
  const pts=data.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const dayMs=S.period===365?7*864e5:864e5;
  const dl=i=>new Date(TODAY-(n-1-i)*dayMs).toLocaleDateString("en-US",{month:"short",day:"numeric"});
  const tf=v=>S.metric==="rev"?moneyS(v):fmt(v);
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H}" width="100%" role="img" aria-label="${m.label} over ${p.label.toLowerCase()}">
    ${[0,max/2,max].map(t=>`<line class="grid" x1="${L}" x2="${Wd-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${esc(tf(t))}</text>`).join("")}
    <polygon class="area" points="${L},${T+ih} ${pts} ${x(n-1)},${T+ih}"/>
    <polyline class="line" pathLength="1" points="${pts}"/>
    <circle class="end" cx="${x(n-1)}" cy="${y(data[n-1])}" r="4.5"/>
    <text x="${L}" y="${H-6}" text-anchor="start">${dl(0)}</text>
    <text x="${L+iw/2}" y="${H-6}" text-anchor="middle">${dl(Math.floor((n-1)/2))}</text>
    <text x="${Wd-R}" y="${H-6}" text-anchor="end">${dl(n-1)}</text>
  </svg>`;
}

function paint(o){

function animate(kind){
  view.classList.remove("enter","data-enter");void view.offsetWidth;

function countUp(){
  if(REDUCED)return;
  const els=[...view.querySelectorAll("[data-count]")];if(!els.length)return;
  const t0=performance.now(),D=800;
  els.forEach(el=>{el._to=+el.dataset.count;el._f=FMT[el.dataset.f]||fmt;el.textContent=el._f(0)});
  (function step(t){const p=Math.max(0,Math.min(1,(t-t0)/D)),e=1-Math.pow(1-p,3);
    els.forEach(el=>{if(el.isConnected&&!el.isContentEditable)el.textContent=el._f(el._to*e)});
    if(p<1)requestAnimationFrame(step)})(t0);
}

/* ---------- tap-to-edit ---------- */
const NUMS=/^(subs|st\.\w+|v\.\d+\.(views|likes|comments))$/;
const parseNum=s=>{let t=String(s);if(cur())t=t.split(cur()).join("");t=t.replace(/[^\d.kmbKMB]/g,"");const m=t.match(/^(\d*\.?\d+)\s*([kKmMbB])?$/);if(!m)return null;return Math.round(parseFloat(m[1])*({k:1e3,m:1e6,b:1e9}[(m[2]||"").toLowerCase()]||1))};
const cById=id=>CFG.comments.find(c=>c.id===id);
function getRaw(path){const g=path.split(".");
  switch(g[0]){case "channel":return CFG.channel;case "subs":return CFG.subs;case "appName":return CFG.appName;
    case "v":return CFG.videos[+g[1]][g[2]];case "st":return P()[g[1]];case "lbl":return lbl(g[1]);
    case "c":return cById(+g[1])[g[2]];case "r":return cById(+g[1]).replies[+g[2]].text}}
function setVal(path,txt){
  let val=txt;if(NUMS.test(path)){val=parseNum(txt);if(val==null){toast("Type a number, like 1200 or 1.2K");return false}}
  if(getRaw(path)===val)return false;
  const g=path.split(".");
  switch(g[0]){case "channel":CFG.channel=val;break;case "subs":CFG.subs=val;break;case "appName":CFG.appName=val;break;
    case "v":CFG.videos[+g[1]][g[2]]=val;break;
    case "st":CFG.stats=CFG.stats||{};(CFG.stats[S.period]=CFG.stats[S.period]||{})[g[1]]=val;break;
    case "lbl":CFG.labels=CFG.labels||{};CFG.labels[g[1]]=val;break;
    case "c":cById(+g[1])[g[2]]=val;break;case "r":cById(+g[1]).replies[+g[2]].text=val;break}
  return true;
}
function startInline(el){
  const path=el.dataset.inline;
  el.dataset.shown=el.textContent;
  el.textContent=String(getRaw(path));
  try{el.contentEditable="plaintext-only"}catch(_){}
  if(el.contentEditable!=="plaintext-only")el.contentEditable="true";
  if(NUMS.test(path))el.setAttribute("inputmode","decimal");
  el.classList.add("editing");el.focus();
  const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);
  el.addEventListener("blur",()=>finishInline(el,true),{once:true});
}
function finishInline(el,commit){
  if(el.contentEditable!=="true"&&el.contentEditable!=="plaintext-only")return;
  el.contentEditable="false";el.classList.remove("editing");
  const path=el.dataset.inline,txt=el.textContent.replace(/\s+/g," ").trim();
  if(commit&&txt&&setVal(path,txt)){
    save();paint({keep:true});toast("Saved");
    const again=document.querySelector(`[data-inline="${path}"]`);if(again){again.classList.add("saved-flash");setTimeout(()=>again.classList.remove("saved-flash"),900)}
  }else el.textContent=el.dataset.shown;
}
function openPicker(kind,i){const f=$("#quick-file");f.dataset.upload=kind;f.dataset.i=i;f.value="";f.click()}

/* ---------- image upload: shrink before saving ---------- */
function readImage(file,max,type,cb){
  if(!file)return;
  if(file.type&&!/^image\//.test(file.type)){toast("That file isn't a picture. Try a PNG or JPG.");return}
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{try{const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL(type,.85))}catch(e){toast("Couldn't use that picture. Try a different one.")}finally{URL.revokeObjectURL(url)}};
  img.onerror=()=>{URL.revokeObjectURL(url);toast("Couldn't open that picture. Try a PNG or JPG.")};
  img.src=url;
}

/* ---------- ripple (pressed-state feedback) ---------- */
const RIPPLE=".trend-btn,.tile,.btn,.tab,.opt,.iconbtn,.lrow,.vset,.fo,.ib,.chip,.rank,.vhead,.vstats,.act,.mtab,.chev,.seg button";
document.addEventListener("pointerdown",e=>{
  if(REDUCED||e.button>0||e.target.closest("[data-inline],input,select"))return;
  const el=e.target.closest(RIPPLE);if(!el)return;
  const z=el.closest(".app,.nav-in")?(CFG.scale||100)/100:el.closest(".sheet-in")?(parseFloat(document.documentElement.style.getPropertyValue("--zoom-sheet"))||1):1;
  const r=el.getBoundingClientRect(),s=Math.max(r.width,r.height)*2/z,sp=document.createElement("span");
  sp.className="ripple";sp.style.cssText=`width:${s}px;height:${s}px;left:${(e.clientX-r.left)/z-s/2}px;top:${(e.clientY-r.top)/z-s/2}px`;
  el.appendChild(sp);setTimeout(()=>sp.remove(),600);
},{passive:true});

  if(inl){if(!inl.classList.contains("editing"))startInline(inl);return}

  if(pk){openPicker(pk.dataset.pick,+pk.dataset.i);return}

  const d=t.dataset;
  if(d.close!==undefined){closeSheet();return}
  if(d.open!==undefined){const card=t.closest(".card"),o=!S.open[d.open];S.open[d.open]=o;card.classList.toggle("open",o);card.querySelectorAll("[aria-expanded]").forEach(b=>b.setAttribute("aria-expanded",o));return}
  if(d.icon){iconSheet(d.icon);return}
  if(d.pickIcon){const k=d.k;CFG.icons=CFG.icons||{};if(d.pickIcon==="auto")delete CFG.icons[k];else CFG.icons[k]=d.pickIcon;save();closeSheet();paint({keep:true});
    const b=document.querySelector(`[data-icon="${k}"]`);if(b)b.classList.add("pop");return}
  if(d.metric){S.metric=d.metric;location.hash="analytics";return}
  if(d.metricTab){if(S.metric===d.metricTab)return;S.metric=d.metricTab;paint({keep:true});const cw=$(".chart-wrap");if(cw)cw.classList.add("draw");return}
  if(d.period){if(S.period===+d.period)return;S.period=+d.period;reloadData();return}
  if(d.sheet==="period"){periodSheet();return}
  if(d.pickPeriod){const n=+d.pickPeriod;closeSheet();if(n!==S.period){S.period=n;reloadData()}return}
  if(d.go){location.hash=d.go;return}
  if(d.cf){S.cf=d.cf;paint({keep:true});return}
  if(d.comf){S.comf=d.comf;paint({keep:true});return}
  if(d.heart){const c=CFG.comments.find(x=>x.id==d.heart);c.hearted=!c.hearted;S.pop=c.hearted?c.id:null;save();paint({keep:true});return}
  if(d.reply){S.replying=S.replying==d.reply?null:+d.reply;paint({keep:true});const i=$("#reply-"+d.reply);if(i)i.focus();return}
  if(d.edit!==undefined){S.armed=null;editSheet(+d.edit);S.from=null;return}
  if(d.editFromSettings!==undefined){S.armed=null;editSheet(+d.editFromSettings,true);S.from="settings";return}
  if(d.doneEdit!==undefined){S.armed=null;S.from==="settings"?settingsSheet(true):closeSheet();return}
  if(d.addVideo!==undefined){const n=CFG.videos.length,id=Math.max(-1,...CFG.videos.map(v=>v.id))+1;
    CFG.videos.push({id,art:n%THUMBS.length,title:"New video",kind:"short",date:toISO(TODAY),views:0,likes:0,comments:0});
    save();paint({keep:true});editSheet(n,true);S.from="settings";toast("Video added");return}
  if(d.delVideo!==undefined){const i=+d.delVideo,v=CFG.videos[i];
    if(S.armed!=="del"+v.id){S.armed="del"+v.id;editSheet(i,true);return}
    const from=S.from;CFG.videos.splice(i,1);S.armed=null;save(true);paint({keep:true});from==="settings"?settingsSheet(true):closeSheet();toast("Video deleted");return}
  if(d.preset){CFG.appIcon={type:"preset",preset:d.preset,color:(CFG.appIcon&&CFG.appIcon.color)||SWATCHES[0]};afterBrandChange();return}
  if(d.color){CFG.appIcon={type:"preset",preset:(CFG.appIcon&&CFG.appIcon.preset)||"lines",color:d.color};afterBrandChange();return}
  if(d.font){CFG.font=d.font;applyFont();afterBrandChange();return}
  if(d.currency){CFG.currency=d.currency;afterBrandChange();return}
  if(d.toggleQe!==undefined){CFG.quickEdit=!QE();afterBrandChange();toast(QE()?"Tap to edit is on":"Tap to edit is off");return}
  if(d.scaleReset!==undefined){CFG.scale=100;applyScale(true);afterBrandChange();return}
  if(d.remove){if(d.remove==="appIcon")CFG.appIcon={type:"preset",preset:CFG.appIcon.preset||"lines",color:CFG.appIcon.color||SWATCHES[0]};
    else if(d.remove==="avatar")CFG.avatar=null;
    else if(d.remove==="thumb"){delete CFG.videos[+d.i].thumb;save();paint({keep:true});editSheet(+d.i,true);return}
    afterBrandChange();return}
  if(d.reset!==undefined){if(S.armed!=="reset"){S.armed="reset";settingsSheet(true);return}
    CFG=clone(DEFAULT);S.armed=null;S.open={0:true};save(true);applyFont();applyScale(true);paint({keep:true});settingsSheet(true);toast("Back to the original sample");return}
  if(d.setup){toast(d.setup+" setup isn't in the preview yet");return}
  if(d.create){closeSheet();toast({short:"Short upload",video:"Video upload",live:"Going live",post:"Posts"}[d.create]+" comes in the full app");return}
  if(d.themePick){S.theme=d.themePick;store.set("theme",S.theme);applyTheme();settingsSheet(true);return}
  if(t.id==="btn-create")createSheet();
  else if(t.id==="btn-bell")bellSheet();
  else if(t.id==="btn-me"){S.armed=null;settingsSheet()}
});
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains("editing")){
    if(e.key==="Enter"){e.preventDefault();t.blur()}
    else if(e.key==="Escape"){e.preventDefault();finishInline(t,false);t.blur()}
    return;
  }
  if((e.key==="Enter"||e.key===" ")&&t.matches&&t.matches("[data-inline],[data-pick],[role=button]:not(button)")){e.preventDefault();t.click();return}
  if(e.key==="Escape")closeSheet();
});
document.addEventListener("paste",e=>{const t=e.target.closest&&e.target.closest(".editing");if(t){e.preventDefault();document.execCommand("insertText",false,(e.clipboardData||window.clipboardData).getData("text/plain"))}});
document.addEventListener("submit",e=>{
  const f=e.target;e.preventDefault();
  if(f.dataset.replyForm){const id=+f.dataset.replyForm,v=f.querySelector("input").value.trim();if(!v)return;
    CFG.comments.find(x=>x.id===id).replies.push({text:v});S.replying=null;save();paint({keep:true});toast("Reply posted")}
});
const num=s=>Math.max(0,parseInt(String(s).replace(/[^\d]/g,""),10)||0);
document.addEventListener("input",e=>{
  const t=e.target,d=t.dataset;
  if(!d)return;
  if(t.id==="q"){S.q=t.value;const pos=t.selectionStart;paint({keep:true});const q=$("#q");q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}return}
  if(t.id==="cfg-scale"){CFG.scale=+t.value;applyScale(false);$("#scale-val").textContent=CFG.scale+"%";save();return}
  if(d.cfg){CFG[d.cfg]=d.cfg==="subs"?num(t.value):t.value;save();paint({keep:true});
    if(d.cfg==="currency")document.querySelectorAll("#layer [data-currency]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.currency===t.value));return}
  if(t.id==="cfg-color"){CFG.appIcon={type:"preset",preset:(CFG.appIcon&&CFG.appIcon.preset)||"lines",color:t.value};save();refreshBrand();
    document.querySelectorAll("#layer .ib").forEach(b=>{b.innerHTML=presetSVG(b.dataset.preset,t.value,40)});return}
  if(d.v){const i=+d.i,v=CFG.videos[i];if(!v)return;
    if(["views","likes","comments"].includes(d.v))v[d.v]=num(t.value);
    else if(d.v==="date"){if(t.value)v.date=t.value}
    else v[d.v]=t.value;
    save();paint({keep:true});
    if(d.v==="kind")editSheet(i,true);
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="cfg-scale"){applyScale(true);settingsSheet(true);return}
  if(t.type!=="file"||!t.files||!t.files[0])return;
  const kind=t.dataset.upload,i=+t.dataset.i;
  readImage(t.files[0],kind==="thumb"?480:256,kind==="appIcon"?"image/png":"image/jpeg",src=>{
    if(kind==="appIcon")CFG.appIcon=Object.assign({},CFG.appIcon,{type:"image",src});
    else if(kind==="avatar")CFG.avatar=src;
    else if(kind==="thumb"&&CFG.videos[i])CFG.videos[i].thumb=src;
    save(true);paint({keep:true});
    if(S.sheet==="edit"&&kind==="thumb")editSheet(i,true);else if(S.sheet==="settings")settingsSheet(true);
    toast("Picture updated");
  });
  t.value="";
});
window.addEventListener("scroll",()=>{$("#top").classList.toggle("scrolled",window.scrollY>4)},{passive:true});
window.addEventListener("hashchange",()=>go(false));
window.smoreBack=function(){const e=document.querySelector(".editing");if(e){e.blur();return true}if(document.querySelector("#layer .sheet:not(.closing)")){closeSheet();return true}if(route()!=="dashboard"){location.hash="dashboard";return true}return false};

/* ---------- pull to refresh: the page eases down, a spinner shows, nothing reloads ---------- */
const ptr=document.createElement("div");ptr.className="ptr";ptr.setAttribute("aria-hidden","true");ptr.innerHTML=I.refresh;document.body.appendChild(ptr);
let py=null,pull=0,busy=false;const MAXP=110,TRIG=70;
function ptrTop(){const t=$("#top");return t?t.getBoundingClientRect().bottom:60}
function ptrSet(d){const arc=ptr.querySelector("circle"),c=47.1,f=Math.min(1,d/TRIG);
  ptr.style.top=(ptrTop()-44)+"px";ptr.style.opacity=Math.min(1,d/30);
  ptr.style.transform=`translateY(${d}px) rotate(${d*2.6}deg)`;arc.setAttribute("stroke-dasharray",`${(f*.78*c).toFixed(1)} ${c}`);
  view.style.transform=d?`translateY(${(d*.45).toFixed(1)}px)`:""}
function ptrReset(){ptr.classList.add("settle");view.classList.add("settle");ptrSet(0);ptr.style.opacity=0;
  setTimeout(()=>{ptr.classList.remove("settle","spin");view.classList.remove("settle");ptr.style.transform="translateY(-50px)";busy=false},340)}
document.addEventListener("touchstart",e=>{
  if(busy||window.scrollY>0||e.touches.length>1||document.querySelector("#layer .sheet")||e.target.closest(".editing,input,textarea,select,.sheet"))py=null;
  else{py=e.touches[0].clientY;pull=0}
},{passive:true});
document.addEventListener("touchmove",e=>{
  if(py==null)return;const dy=e.touches[0].clientY-py;
  if(dy<=0||window.scrollY>0){if(pull){pull=0;ptrSet(0)}return}
  if(e.cancelable)e.preventDefault();
  pull=Math.min(MAXP,dy*.5);ptrSet(pull);
},{passive:false});
document.addEventListener("touchend",()=>{
  if(py==null)return;py=null;
  if(pull>=TRIG){busy=true;ptr.classList.add("settle");view.classList.add("settle");ptrSet(TRIG);
    setTimeout(()=>{ptr.classList.remove("settle");ptr.classList.add("spin")},300);
    setTimeout(ptrReset,1100)}
  else if(pull>0)ptrReset();
  pull=0;
});

buildNav();paint();
})();
</script>
